<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090f" />
      <stop offset="100%" stop-color="#0e0e1a" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161526" />
      <stop offset="100%" stop-color="#10101c" />
    </linearGradient>
    <linearGradient id="purpleGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" rx="16" fill="url(#bgGrad2)" stroke="#232338" stroke-width="1.5" />

  <!-- Badge Header -->
  <rect x="340" y="22" width="280" height="30" rx="15" fill="#1e1338" stroke="#7e22ce" stroke-width="1" />
  <text x="480" y="42" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">ATOMIC SETTLEMENT &amp; PAYMENT ENGINE</text>

  <!-- Left: Buyer -->
  <g transform="translate(40, 160)">
    <rect width="180" height="150" rx="12" fill="url(#boxGrad)" stroke="#373756" stroke-width="1.5" />
    <circle cx="90" cy="45" r="22" fill="#2e1065" stroke="#a855f7" stroke-width="1.5" />
    <text x="90" y="52" fill="#e9d5ff" font-family="-apple-system, sans-serif" font-size="20" text-anchor="middle">👤</text>
    <text x="90" y="90" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Buyer Wallet</text>
    <text x="90" y="110" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">Signs purchase() call</text>
    <text x="90" y="125" fill="#a855f7" font-family="monospace" font-size="9" text-anchor="middle">Provides Payment Token</text>
  </g>

  <!-- Center Arrow to Contract -->
  <g transform="translate(225, 225)">
    <line x1="0" y1="10" x2="50" y2="10" stroke="#a855f7" stroke-width="2.5" />
    <polygon points="50,5 60,10 50,15" fill="#a855f7" />
    <text x="30" y="-2" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Invokes</text>
  </g>

  <!-- Center: Kiosk Smart Contract -->
  <g transform="translate(290, 85)">
    <rect width="320" height="300" rx="14" fill="#141126" stroke="#9333ea" stroke-width="1.5" />
    
    <!-- Title -->
    <rect x="20" y="16" width="280" height="34" rx="8" fill="#241442" />
    <text x="160" y="38" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Kiosk Contract: purchase()</text>

    <!-- Subtitle -->
    <text x="160" y="70" fill="#a78bfa" font-family="monospace" font-size="10" text-anchor="middle">Single Atomic Ledger Envelope</text>

    <!-- Internal Steps list -->
    <rect x="20" y="85" width="280" height="185" rx="8" fill="#0d0d1a" stroke="#2d2d48" stroke-width="1" />
    
    <text x="32" y="110" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">1. Verification</text>
    <text x="42" y="126" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">• Checks buyer auth &amp; listed status</text>
    <text x="42" y="140" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">• Loads active royalty policy rules</text>

    <text x="32" y="164" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">2. Fee Math Calculation</text>
    <text x="42" y="180" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">• Royalty = (Price × royalty_bps) / 10,000</text>
    <text x="42" y="194" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">• Upstream = (Price × split_bps) / 10,000</text>
    <text x="42" y="208" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">• Seller Net = Price - Royalty - Upstream</text>

    <text x="32" y="232" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">3. Execution Invariant</text>
    <text x="42" y="248" fill="#6ee7b7" font-family="-apple-system, sans-serif" font-size="10">If any payout fails ──► 100% REVERTS</text>
  </g>

  <!-- Right Distribution Arrows & Targets -->
  <!-- Target 1: Creator Royalty -->
  <g transform="translate(615, 95)">
    <line x1="0" y1="25" x2="65" y2="25" stroke="#c084fc" stroke-width="2" />
    <polygon points="65,21 73,25 65,29" fill="#c084fc" />
    
    <g transform="translate(80, 0)">
      <rect width="225" height="52" rx="8" fill="#1b122e" stroke="#7e22ce" stroke-width="1" />
      <text x="16" y="22" fill="#d8b4fe" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Creator Royalty</text>
      <text x="16" y="40" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Sent to Creator Address (e.g. 5%)</text>
    </g>
  </g>

  <!-- Target 2: Protocol Treasury Split -->
  <g transform="translate(615, 175)">
    <line x1="0" y1="25" x2="65" y2="25" stroke="#818cf8" stroke-width="2" />
    <polygon points="65,21 73,25 65,29" fill="#818cf8" />

    <g transform="translate(80, 0)">
      <rect width="225" height="52" rx="8" fill="#16182e" stroke="#4338ca" stroke-width="1" />
      <text x="16" y="22" fill="#a5b4fc" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Upstream Splits / Treasury</text>
      <text x="16" y="40" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Sent to Ecosystem DAOs (e.g. 2.5%)</text>
    </g>
  </g>

  <!-- Target 3: Seller Net Payout -->
  <g transform="translate(615, 255)">
    <line x1="0" y1="25" x2="65" y2="25" stroke="#38bdf8" stroke-width="2" />
    <polygon points="65,21 73,25 65,29" fill="#38bdf8" />

    <g transform="translate(80, 0)">
      <rect width="225" height="52" rx="8" fill="#101e2e" stroke="#0284c7" stroke-width="1" />
      <text x="16" y="22" fill="#7dd3fc" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Net Seller Payout</text>
      <text x="16" y="40" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Sent to Seller Wallet (Remaining 92.5%)</text>
    </g>
  </g>

  <!-- Target 4: Asset Delivery back to Buyer -->
  <g transform="translate(615, 335)">
    <line x1="0" y1="25" x2="65" y2="25" stroke="#34d399" stroke-width="2" />
    <polygon points="65,21 73,25 65,29" fill="#34d399" />

    <g transform="translate(80, 0)">
      <rect width="225" height="52" rx="8" fill="#0d261e" stroke="#059669" stroke-width="1" />
      <text x="16" y="22" fill="#6ee7b7" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Escrow Asset Delivery</text>
      <text x="16" y="40" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Contract transfers asset tokens ──► Buyer</text>
    </g>
  </g>

  <!-- Footer Banner -->
  <rect x="40" y="415" width="880" height="42" rx="8" fill="#111122" stroke="#222238" />
  <text x="480" y="441" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">
    🛡️ <tspan fill="#ffffff" font-weight="700">Non-Custodial Atomic Guarantee:</tspan> All four transfers execute in the exact same ledger transaction. Zero counterparty risk.
  </text>
</svg>
