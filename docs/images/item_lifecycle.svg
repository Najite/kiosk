<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090f" />
      <stop offset="100%" stop-color="#0e0e1a" />
    </linearGradient>
    <linearGradient id="boxGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161526" />
      <stop offset="100%" stop-color="#10101c" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" rx="16" fill="url(#bgGrad3)" stroke="#232338" stroke-width="1.5" />

  <!-- Badge Header -->
  <rect x="330" y="22" width="300" height="30" rx="15" fill="#1e1338" stroke="#7e22ce" stroke-width="1" />
  <text x="480" y="42" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">ITEM LIFECYCLE &amp; ON-CHAIN STORAGE</text>

  <!-- TOP HALF: 3-STAGE STATE MACHINE -->
  <!-- Stage 1: Placed -->
  <g transform="translate(60, 80)">
    <rect width="240" height="150" rx="12" fill="url(#boxGrad3)" stroke="#6366f1" stroke-width="1.5" />
    <rect x="16" y="14" width="70" height="20" rx="5" fill="#1e1b4b" />
    <text x="51" y="28" fill="#818cf8" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">STATUS: 1</text>
    
    <text x="16" y="56" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Placed in Vault</text>
    <text x="16" y="78" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">• Tokens escrowed in contract</text>
    <text x="16" y="96" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">• is_listed = false</text>
    <text x="16" y="114" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">• Seller retains full custody</text>
    
    <rect x="16" y="124" width="208" height="18" rx="4" fill="#18182b" />
    <text x="120" y="137" fill="#818cf8" font-family="monospace" font-size="9" text-anchor="middle">Can withdraw() anytime</text>
  </g>

  <!-- Arrow 1 -> 2: list() -->
  <g transform="translate(305, 145)">
    <line x1="0" y1="0" x2="45" y2="0" stroke="#a855f7" stroke-width="2" />
    <polygon points="45,-4 53,0 45,4" fill="#a855f7" />
    <text x="25" y="-10" fill="#c084fc" font-family="monospace" font-size="10" text-anchor="middle">list()</text>
  </g>
  <!-- Return Arrow 2 -> 1: delist() -->
  <g transform="translate(305, 175)">
    <line x1="53" y1="0" x2="8" y2="0" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,3" />
    <polygon points="8,-3 0,0 8,3" fill="#64748b" />
    <text x="25" y="16" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">delist()</text>
  </g>

  <!-- Stage 2: Listed -->
  <g transform="translate(360, 80)">
    <rect width="240" height="150" rx="12" fill="url(#boxGrad3)" stroke="#a855f7" stroke-width="1.5" />
    <rect x="16" y="14" width="70" height="20" rx="5" fill="#2e1065" />
    <text x="51" y="28" fill="#c084fc" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">STATUS: 2</text>
    
    <text x="16" y="56" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Listed on Market</text>
    <text x="16" y="78" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">• Price bound to payment token</text>
    <text x="16" y="96" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">• price &gt;= min_floor_price</text>
    <text x="16" y="114" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">• is_listed = true</text>
    
    <rect x="16" y="124" width="208" height="18" rx="4" fill="#18182b" />
    <text x="120" y="137" fill="#f43f5e" font-family="monospace" font-size="9" text-anchor="middle">Withdrawals strictly blocked</text>
  </g>

  <!-- Arrow 2 -> 3: purchase() -->
  <g transform="translate(605, 155)">
    <line x1="0" y1="0" x2="45" y2="0" stroke="#10b981" stroke-width="2.5" />
    <polygon points="45,-4 53,0 45,4" fill="#10b981" />
    <text x="25" y="-10" fill="#34d399" font-family="monospace" font-size="10" text-anchor="middle">purchase()</text>
  </g>

  <!-- Stage 3: Sold -->
  <g transform="translate(660, 80)">
    <rect width="240" height="150" rx="12" fill="url(#boxGrad3)" stroke="#10b981" stroke-width="1.5" />
    <rect x="16" y="14" width="70" height="20" rx="5" fill="#064e3b" />
    <text x="51" y="28" fill="#34d399" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">STATUS: 3</text>
    
    <text x="16" y="56" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Sold &amp; Delivered</text>
    <text x="16" y="78" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">• Asset transferred to buyer</text>
    <text x="16" y="96" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">• item.seller = buyer (owner)</text>
    <text x="16" y="114" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">• is_listed = false</text>
    
    <rect x="16" y="124" width="208" height="18" rx="4" fill="#18182b" />
    <text x="120" y="137" fill="#34d399" font-family="monospace" font-size="9" text-anchor="middle">Settled to Buyer Wallet</text>
  </g>

  <!-- BOTTOM HALF: SOROBAN STORAGE MODEL SPLIT -->
  <g transform="translate(60, 260)">
    <rect width="840" height="180" rx="12" fill="#121221" stroke="#2a2a44" stroke-width="1" />
    
    <!-- Title -->
    <text x="20" y="26" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">SOROBAN ON-CHAIN STORAGE ALLOCATION &amp; RENT</text>

    <!-- Column 1: Instance Storage -->
    <rect x="20" y="40" width="390" height="120" rx="8" fill="#18182b" stroke="#373756" stroke-width="1" />
    <text x="36" y="62" fill="#a78bfa" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Instance Storage (Protocol Scope)</text>
    <text x="36" y="82" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">• DataKey::Owner ──► Admin Address</text>
    <text x="36" y="100" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">• DataKey::DefaultPolicy ──► Fallback Royalties &amp; Splits</text>
    <text x="36" y="118" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">• DataKey::ItemCount ──► Monotonic Total Counter</text>
    <text x="36" y="142" fill="#64748b" font-family="monospace" font-size="10">TTL: extend_ttl(50_000, 100_000)</text>

    <!-- Column 2: Persistent Storage -->
    <rect x="430" y="40" width="390" height="120" rx="8" fill="#18182b" stroke="#373756" stroke-width="1" />
    <text x="446" y="62" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Persistent Storage (Item Scope)</text>
    <text x="446" y="82" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">• DataKey::Item(u32) ──► ListingItem Details</text>
    <text x="446" y="100" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">• DataKey::AssetPolicy(Address) ──► Collection Rules</text>
    <text x="446" y="118" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">• State Reclaim: remove() deletes key upon withdraw()</text>
    <text x="446" y="142" fill="#64748b" font-family="monospace" font-size="10">Rent reclaimed back to contract</text>
  </g>
</svg>
